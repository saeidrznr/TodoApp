{% include "layout.html" %}
<div class="container">
    <div class="card">
        <div class="card-header">
            Register
        </div>
        <div class="card-body">
            <form id="registerForm">
                <div class="form-row">

                    <div class="form-group col-md-6">
                        <label>Username</label>
                        <input class="form-control" type="text" name="username" autocomplete="username" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>First Name</label>
                        <input class="form-control" type="text" name="firstname" autocomplete="firstname" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Last Name</label>
                        <input class="form-control" type="text" name="lastname" autocomplete="lastname" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Email</label>
                        <input class="form-control" type="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Phone number</label>
                        <input class="form-control" type="tel" name="phone_number" autocomplete="tel" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Role</label>
                        <input class="form-control" type="text" name="role" autocomplete="role">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input class="form-control" type="password" name="password" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input class="form-control" type="password" name="password2" autocomplete="new-password"
                           required>
                </div>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </div>
        <div class="card-footer text-muted">
            <a href="/auth/login-page">Already have an account?</a>
        </div>
    </div>
</div>
